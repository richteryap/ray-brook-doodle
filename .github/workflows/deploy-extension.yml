name: Package Browser Extension

on:
  push:
    tags:
      - "ext-v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Package Extension (.zip & .xpi)
        run: |
          cd browser-extension
          zip -r ../ray-brook-extension.zip . -x "*.git*"
          cp ../ray-brook-extension.zip ../ray-brook-extension.xpi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ray-brook-extension.zip
            ray-brook-extension.xpi
          generate_release_notes: true
