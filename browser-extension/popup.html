<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            background-color: #1b1d24;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            width: 250px;
            padding: 20px;
            text-align: center;
            margin: 0;
        }
        .title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #4a90e2; 
        }
        .btn {
            background-color: #4a90e2;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }
        .btn:hover { background-color: #357abd; }
        .btn:active { background-color: #285a8f; }
        
        .input-field {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 8px;
            border: 1px solid #4a90e2;
            background-color: #2a2d36;
            color: white;
            outline: none;
        }
        .btn-save { background-color: #2e7d32; }
        .btn-save:hover { background-color: #1b5e20; }
        .btn-change { background-color: #64748b; padding: 8px 15px; font-size: 13px; }
        .btn-change:hover { background-color: #475569; }
        
        #status {
            margin-top: 15px;
            font-size: 12px;
            color: #a0a0a0;
        }
        
        .hidden { display: none; }
        .mb-15 { margin-bottom: 15px; }
        .text-success { color: #4caf50; font-size: 14px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="title">Ray Brook Logs</div>
    
    <div id="keyInputContainer" class="mb-15">
        <input type="password" id="apiKeyInput" class="input-field" placeholder="Enter Secret API Key" />
        <button id="saveKeyBtn" class="btn btn-save">Save Key</button>
    </div>

    <div id="keySavedContainer" class="mb-15 hidden">
        <div class="text-success">✓ API Key is saved</div>
        <button id="changeKeyBtn" class="btn btn-change">Change Key</button>
    </div>
    
    <button id="logBtn" class="btn">Log Episode</button>
    <div id="status">Waiting...</div>
    <script src="popup.js"></script>
</body>
</html>
