<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            background-color: #1b1d24;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            width: 250px;
            padding: 20px;
            text-align: center;
            margin: 0;
        }
        .title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #4a90e2; 
        }
        .btn {
            background-color: #4a90e2;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }
        .btn:hover {
            background-color: #357abd;
        }
        .btn:active {
            background-color: #285a8f;
        }
        #status {
            margin-top: 15px;
            font-size: 12px;
            color: #a0a0a0;
        }
    </style>
</head>
<body>
    <div class="title">LogStream Tracker</div>
    <button id="logBtn" class="btn">Log Episode</button>
    <div id="status">Waiting...</div>

    <script src="popup.js"></script>
</body>
</html>
